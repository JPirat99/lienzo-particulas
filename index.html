<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lienzo de Partículas</title>
<style>
  :root {
    --bg: #07070c;
    --panel: rgba(20, 20, 32, 0.78);
    --text: #e8e8f0;
    --muted: #9a9ab0;
    --accent: #ff5fa2;
    --border: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }

  .panel {
    position: fixed; top: 16px; left: 16px; max-width: calc(100vw - 32px);
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    user-select: none;
  }
  .panel h1 { font-size: 15px; margin: 0; width: 100%; letter-spacing: .02em; }
  .panel h1 span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  input[type=range] { width: 90px; accent-color: var(--accent); }
  output { color: var(--text); min-width: 1.5em; font-variant-numeric: tabular-nums; }
  .palettes { display: flex; gap: 6px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  .swatch.active { border-color: var(--text); }
  button.btn {
    background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit;
  }
  button.btn:hover { background: rgba(255,255,255,.16); }
  button.btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hint {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    color: var(--muted); font-size: 13px; pointer-events: none; transition: opacity .8s;
    text-align: center; padding: 0 16px;
  }
  .hidden { display: none; }
  .toggle { position: fixed; top: 16px; right: 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="panel">
  <h1>✦ Lienzo de Partículas <span>arrastra para pintar</span></h1>
  <label>Simetría <input id="sym" type="range" min="1" max="12" value="6"><output id="symOut">6</output></label>
  <label>Tamaño <input id="size" type="range" min="1" max="10" value="4"><output id="sizeOut">4</output></label>
  <div class="palettes" id="palettes"></div>
  <button class="btn on" id="mirror" title="Espejo (M)">Espejo</button>
  <button class="btn" id="fade" title="Estelas que se desvanecen (F)">Desvanecer</button>
  <button class="btn" id="clear" title="Borrar (C)">Borrar</button>
  <button class="btn" id="save" title="Guardar PNG (S)">Guardar PNG</button>
</div>
<button class="btn toggle" id="hide" title="Ocultar panel (H)">☰</button>
<div class="hint" id="hint">Mantén pulsado y mueve · Teclas: 1–9 simetría · M espejo · F desvanecer · C borrar · S guardar · H panel</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const BG = '#07070c';

const PALETTES = [
  { name: 'Neón',    colors: ['#ff5fa2', '#7c5cff', '#28d7ff', '#ffe066'] },
  { name: 'Fuego',   colors: ['#ff3b30', '#ff9500', '#ffcc00', '#fff2b3'] },
  { name: 'Océano',  colors: ['#00c2ff', '#00ffc6', '#3a86ff', '#caf0f8'] },
  { name: 'Bosque',  colors: ['#80ed99', '#57cc99', '#c7f9cc', '#f4d35e'] },
  { name: 'Arcoíris', colors: null }, // tono que rota con el tiempo
];

const state = {
  symmetry: 6,
  size: 4,
  mirror: true,
  fade: false,
  palette: 0,
  drawing: false,
  last: null,
  hue: 0,
};

let particles = [];
const MAX_PARTICLES = 900;
let W = 0, H = 0, dpr = 1;

function resize() {
  // Conserva el dibujo al redimensionar
  const snapshot = W ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (snapshot) ctx.putImageData(snapshot, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function pickColor() {
  const p = PALETTES[state.palette];
  if (!p.colors) return `hsl(${state.hue % 360}, 100%, 62%)`;
  return p.colors[(Math.random() * p.colors.length) | 0];
}

function spawn(x, y, vx, vy) {
  const speed = Math.hypot(vx, vy);
  const count = 2 + Math.min(6, speed / 4) | 0;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 1.2;
    particles.push({
      // coordenadas relativas al centro, para aplicar la simetría
      x: x - W / 2, y: y - H / 2,
      vx: vx * 0.15 + Math.cos(a) * s,
      vy: vy * 0.15 + Math.sin(a) * s,
      life: 1,
      decay: 0.008 + Math.random() * 0.018,
      r: state.size * (0.4 + Math.random() * 0.8),
      color: pickColor(),
    });
  }
  if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
}

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  state.drawing = true;
  state.last = pointerPos(e);
  spawn(state.last.x, state.last.y, 0, 0);
  hideHint();
});
canvas.addEventListener('pointermove', e => {
  if (!state.drawing) return;
  const p = pointerPos(e);
  const dx = p.x - state.last.x, dy = p.y - state.last.y;
  // Interpola para que los trazos rápidos no queden con huecos
  const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 6));
  for (let i = 1; i <= steps; i++) {
    spawn(state.last.x + dx * i / steps, state.last.y + dy * i / steps, dx, dy);
  }
  state.last = p;
});
const stop = () => { state.drawing = false; };
canvas.addEventListener('pointerup', stop);
canvas.addEventListener('pointercancel', stop);

function frame() {
  state.hue += 0.6;

  if (state.fade) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(7, 7, 12, 0.08)';
    ctx.fillRect(0, 0, W, H);
  }

  // En modo persistente, la mezcla aditiva saturaría todo a blanco
  ctx.globalCompositeOperation = state.fade ? 'lighter' : 'source-over';
  const n = state.symmetry;
  const step = (Math.PI * 2) / n;

  ctx.save();
  ctx.translate(W / 2, H / 2);
  for (let k = 0; k < n; k++) {
    for (let m = 0; m < (state.mirror ? 2 : 1); m++) {
      ctx.save();
      ctx.rotate(step * k);
      if (m) ctx.scale(1, -1);
      for (const p of particles) {
        ctx.globalAlpha = p.life * (state.fade ? 0.35 : 0.25);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life + 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- Controles ----
const $ = id => document.getElementById(id);

function setSymmetry(v) {
  state.symmetry = v; $('sym').value = v; $('symOut').textContent = v;
}
$('sym').addEventListener('input', e => setSymmetry(+e.target.value));
$('size').addEventListener('input', e => { state.size = +e.target.value; $('sizeOut').textContent = e.target.value; });

const paletteBox = $('palettes');
PALETTES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'swatch' + (i === state.palette ? ' active' : '');
  b.title = p.name;
  b.style.background = p.colors
    ? `conic-gradient(${p.colors.join(',')}, ${p.colors[0]})`
    : 'conic-gradient(red, yellow, lime, cyan, blue, magenta, red)';
  b.addEventListener('click', () => {
    state.palette = i;
    [...paletteBox.children].forEach((c, j) => c.classList.toggle('active', j === i));
  });
  paletteBox.appendChild(b);
});

function toggleMirror() { state.mirror = !state.mirror; $('mirror').classList.toggle('on', state.mirror); }
function toggleFade() { state.fade = !state.fade; $('fade').classList.toggle('on', state.fade); }
function clearCanvas() {
  particles = [];
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
}
function savePNG() {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `lienzo-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
}
function togglePanel() { $('panel').classList.toggle('hidden'); }

$('mirror').addEventListener('click', toggleMirror);
$('fade').addEventListener('click', toggleFade);
$('clear').addEventListener('click', clearCanvas);
$('save').addEventListener('click', savePNG);
$('hide').addEventListener('click', togglePanel);

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '9') setSymmetry(+k);
  else if (k === 'm') toggleMirror();
  else if (k === 'f') toggleFade();
  else if (k === 'c') clearCanvas();
  else if (k === 's') savePNG();
  else if (k === 'h') togglePanel();
});

let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  $('hint').style.opacity = 0;
}
</script>
</body>
</html>
